<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Word engine demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #141210;
        --bg-raise: #221c17;
        --line: #3c342c;
        --ink: #f4efe4;
        --muted: #a89b8c;
        --gold: #e4c27a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, #3a3024 0%, transparent 55%),
          var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", Candara, sans-serif;
      }
      main {
        width: min(420px, calc(100% - 2rem));
        padding: 1.25rem;
        background: var(--bg-raise);
        border: 1px solid var(--line);
        border-radius: 0.8rem;
      }
      h1 {
        margin: 0 0 0.4rem;
        font-family: Palatino, "Palatino Linotype", Georgia, serif;
        font-size: 1.8rem;
        font-weight: 500;
      }
      p { margin: 0; color: var(--muted); }
      form { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.25rem; }
      label { color: var(--muted); }
      input {
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.7rem 0.9rem;
      }
      input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
      button {
        font: inherit;
        color: #1b1713;
        background: var(--gold);
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 0.9rem;
        cursor: pointer;
      }
      button:disabled { cursor: default; opacity: 0.6; }
      .error { color: #e7a090; min-height: 1.25rem; margin-top: 0.75rem; }
      .status { color: var(--gold); min-height: 1.25rem; margin-top: 0.75rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Word engine</h1>
      <p>Enter the password to open the demo.</p>
      <form id="unlock">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button id="open" type="submit">Open</button>
      </form>
      <p class="status" id="status"></p>
      <p class="error" id="error"></p>
    </main>
    <script type="module">
      const MAGIC = 'WENG';
const HEADER_BYTES = 4 + 1 + 4 + 16 + 12;

export async function openVault(bytes, password) {
  const plain = await decryptVault(bytes, password);
  return unzip(plain);
}

export async function decryptVault(bytes, password) {
  if (bytes.length < HEADER_BYTES) {
    throw new Error('This file is not an encrypted demo.');
  }
  const magic = new TextDecoder().decode(bytes.subarray(0, 4));
  if (magic !== MAGIC) {
    throw new Error('This file is not an encrypted demo.');
  }
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const version = view.getUint8(4);
  if (version !== 1) {
    throw new Error(`Unknown demo version ${version}.`);
  }
  const iterations = view.getUint32(5);
  const salt = bytes.subarray(9, 25);
  const iv = bytes.subarray(25, 37);
  const ciphertext = bytes.subarray(37);
  const baseKey = await crypto.subtle.importKey(
    'raw',
    new TextEncoder().encode(password),
    'PBKDF2',
    false,
    ['deriveKey'],
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt'],
  );
  try {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
    return new Uint8Array(plain);
  } catch {
    throw new Error('Wrong password.');
  }
}

export async function unzip(bytes) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const files = new Map();
  let offset = 0;
  while (offset + 30 <= bytes.length) {
    const signature = view.getUint32(offset, true);
    if (signature === 0x02014b50 || signature === 0x06054b50) {
      break;
    }
    if (signature !== 0x04034b50) {
      throw new Error('The demo archive is damaged.');
    }
    const method = view.getUint16(offset + 8, true);
    const compressedSize = view.getUint32(offset + 18, true);
    const nameLength = view.getUint16(offset + 26, true);
    const extraLength = view.getUint16(offset + 28, true);
    const nameStart = offset + 30;
    const name = new TextDecoder().decode(bytes.subarray(nameStart, nameStart + nameLength));
    const dataStart = nameStart + nameLength + extraLength;
    const compressed = bytes.subarray(dataStart, dataStart + compressedSize);
    let data;
    if (method === 0) {
      data = compressed.slice();
    } else if (method === 8) {
      const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      data = new Uint8Array(await new Response(stream).arrayBuffer());
    } else {
      throw new Error(`Unsupported zip method ${method}.`);
    }
    if (name && !name.endsWith('/')) {
      files.set(name, data);
    }
    offset = dataStart + compressedSize;
  }
  return files;
}


      const form = document.querySelector('#unlock');
      const password = document.querySelector('#password');
      const button = document.querySelector('#open');
      const error = document.querySelector('#error');
      const status = document.querySelector('#status');
      const payloadUrl = 'payload-94c434001025.enc';

      function paint() {
        return new Promise((resolve) => {
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        });
      }

      async function controller() {
        if (navigator.serviceWorker.controller) {
          return navigator.serviceWorker.controller;
        }
        const ready = new Promise((resolve) => {
          navigator.serviceWorker.addEventListener('controllerchange', () => resolve(), { once: true });
        });
        await navigator.serviceWorker.register('sw.js');
        if (navigator.serviceWorker.controller) {
          return navigator.serviceWorker.controller;
        }
        await ready;
        return navigator.serviceWorker.controller;
      }

      async function unlock(value) {
        error.textContent = '';
        button.disabled = true;
        password.disabled = true;
        status.textContent = 'Decrypting…';
        await paint();
        try {
          if (!crypto.subtle || !navigator.serviceWorker) {
            throw new Error('This browser cannot open the encrypted demo.');
          }
          const response = await fetch(payloadUrl);
          if (!response.ok) {
            throw new Error(`Could not download the demo (${response.status}).`);
          }
          const bytes = new Uint8Array(await response.arrayBuffer());
          status.textContent = 'Decrypting…';
          await paint();
          const files = await openVault(bytes, value);
          const worker = await controller();
          if (!worker) {
            throw new Error('The demo could not be loaded.');
          }
          const entries = [...files.entries()].map(([name, data]) => [name, data.buffer]);
          const channel = new MessageChannel();
          const mounted = new Promise((resolve, reject) => {
            channel.port1.onmessage = (message) => {
              if (message.data?.ok) {
                resolve();
              } else {
                reject(new Error('The demo could not be loaded.'));
              }
            };
          });
          worker.postMessage(
            {
              type: 'mount',
              appPrefix: new URL('app/', document.baseURI).pathname,
              files: entries,
            },
            [channel.port2, ...entries.map(([, buffer]) => buffer)],
          );
          await mounted;
          location.assign(new URL('app/index.html', document.baseURI));
        } catch (err) {
          status.textContent = '';
          error.textContent = err instanceof Error ? err.message : String(err);
          button.disabled = false;
          password.disabled = false;
        }
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        unlock(password.value);
      });

      const fromUrl = new URLSearchParams(location.search).get('password');
      if (fromUrl) {
        password.value = fromUrl;
        unlock(fromUrl);
      }
    </script>
  </body>
</html>
